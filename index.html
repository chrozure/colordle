<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>Color Permutation Game</title>
</head>
<body>
  <h1>Color Permutation Game</h1>

  <div class="difficulty-selector">
    <label for="difficultyInput">Choose difficulty (3-7): </label>
    <input type="number" id="difficultyInput" min="3" max="7" value="4">
    <button id="startButton">Start Game</button>
  </div>

  <div class="game-container" id="gameContainer">
    <p class="game-description">
      Try to guess the correct order of the colors!<br>
      Click on colors below to place them in order, then submit your guess.
    </p>

    <div class="colors-container" id="colorOptions"></div>

    <div class="selected-colors" id="selectedColors"></div>

    <button id="submitButton" disabled>Submit Guess</button>

    <div class="feedback" id="feedback"></div>
    <div class="attempts" id="attemptsCounter">Attempts: 0</div>

    <div class="history-container" id="historyContainer">
      <h3>Previous Attempts</h3>
      <div id="attemptsHistory"></div>
    </div>

    <div class="win-message" id="winMessage">
      🎉 Congratulations! You found the correct sequence! 🎉
    </div>

    <button id="resetButton">Play Again</button>
  </div>

  <script src="scripts.js"></script>
</body>
</html>
